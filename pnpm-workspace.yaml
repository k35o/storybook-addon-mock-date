minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - '@k8o/*'

blockExoticSubdeps: true
verifyDepsBeforeRun: install
savePrefix: ''

allowBuilds:
  esbuild: false

# Moved from package.json "overrides" (storybook: $storybook): pnpm 11 does not
# read overrides from package.json, and the "$" reference syntax is deprecated,
# so the version is written out to match the storybook devDependency.
overrides:
  storybook: 10.6.7
  # vite-plus 0.2.8 pins oxfmt 0.61.0, which pins tinypool 2.1.0 (critical
  # advisories). vite-plus 0.3 and later need `vite` aliased to their bundled
  # core, which would put Storybook's dev server back on an unpatched Vite.
  oxfmt>tinypool: 2.1.2

versioning:
  changelog:
    storage: repository
