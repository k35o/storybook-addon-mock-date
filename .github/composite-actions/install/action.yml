name: Install
description: Sets up mise and runs install

runs:
  using: composite
  steps:
    - name: Setup mise
      uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
      with:
        cache: true

    - name: Install dependencies
      shell: bash
      run: pnpm ci

    - name: Build
      shell: bash
      run: pnpm build
